  <div class="review-controls">
    <label>Territory / الاتجاه<select id="jid-territory"><option value="a">A · The Living Edition</option><option value="b">B · The Passage</option><option value="c">C · The Evidence Bench</option></select></label>
    <label>Experience / التجربة<select id="jid-experience"><option value="0">R1 · Public Front Door</option><option value="1">R2 · Individual Home</option><option value="2">R3 · Career Record</option><option value="3">R4 · Opportunity + Apply</option><option value="4">R5 · Organization Onboarding</option><option value="5">R6 · Employer Hiring</option><option value="6">R7 · University Outcomes</option></select></label>

  </div>
  <div class="review-note">Concept compositions · تصورات للمراجعة · Structural examples, no live records. Product actions are illustrative. Font stand-ins; no direction selected.</div>
  <div id="jid-stage" aria-live="polite"></div>
  <script>
  (()=>{
    const root=document.getElementById('jid-territories');
    const stage=root.querySelector('#jid-stage');
    const territory=root.querySelector('#jid-territory');
    const experience=root.querySelector('#jid-experience');
    const language=root.querySelector('#jid-language');
    const text={
      ar:{brand:'جِد',definition:'منصة البنية التحتية المهنية في السعودية',contents:'المحتويات',workspace:'مساحة العمل',record:'السجل المهني',opportunities:'الفرص',applications:'طلباتي',education:'التعليم',work:'الخبرات',skills:'المهارات',evidence:'الإثباتات',source:'المصدر',visibility:'نطاق المشاركة',outputs:'مخرجات السجل',private:'الإثباتات خاصة افتراضياً',empty:'لا توجد بيانات للعرض في هذا التصور',individual:'فرد',employer:'جهة توظيف',university:'جامعة',iPurpose:'ابنِ سجلك المهني وحدد ما تشاركه.',ePurpose:'حدّد المعايير وافحص الأدلة قبل القرار.',uPurpose:'افهم المخرجات ضمن حدود البيانات والخصوصية.',start:'ابدأ كفرد',institution:'تسجيل جهة توظيف أو جامعة',basis:'أساس المعلومة',noSource:'لا يوجد مصدر معروض',review:'راجع ما ستشاركه',recipient:'الجهة المستقبلة',disclosure:'المعلومات التي ستُشارك',noDisclosure:'لا توجد معلومات محددة للمشاركة في هذا التصور.',criteria:'معايير الدور',required:'الإثبات المطلوب',available:'الإثبات المتاح',noEvidence:'لا توجد أدلة معروضة',rationale:'القرار ومبرراته',human:'قرار بشري بعد مراجعة الأدلة',method:'المنهجية',coverage:'التغطية',period:'الفترة',population:'المجتمع المؤهل',suppressed:'محجوب لحماية الخصوصية',suppressedReason:'حالة توضيحية: لا تُعرض قيم أو تفاصيل قابلة للاستنتاج.',unavailable:'لا توجد بيانات معتمدة للعرض',unknown:'غير متاح في هذا التصور',email:'البريد الإلكتروني للحساب',verify:'تحقق من بريدك الإلكتروني',verifyInfo:'تحقق من بريد الحساب قبل إرسال بيانات الجهة وممثلها.',orgDetails:'بيانات الجهة وممثلها',pending:'قيد المراجعة',authorized:'مساحة العمل بعد الموافقة',noClaim:'تسجيل الجهة والتحقق من صفة الممثل',addRecord:'ابدأ سجلك المهني',inspect:'افحص الإثبات',aTitle:'حياتك المهنية، بسياقها',bTitle:'من سجلك، إلى خطوتك التالية',cTitle:'الحقيقة المهنية، أساس الخطوة التالية',aHome:'مساحتك المهنية',bHome:'خطوتك التالية',cHome:'سجلك، بين يديك',homeIntro:'ابدأ من الحقائق المهنية التي تريد توثيقها. تحدد أنت ما يُشارك ومع من.',rTitle:'سجل واحد، تعبيرات متعددة',rIntro:'التعليم والخبرة والمهارات في سجل مهني واحد. السيرة الذاتية مخرج من هذا السجل.',oTitle:'الفرصة، وما تحتاجه من إثبات',oIntro:'راجع متطلبات الفرصة والمعلومات التي ستشاركها قبل التقديم.',eTitle:'الأدلة قبل القرار',eIntro:'قارن الأدلة بالمعايير نفسها. لا درجة موحدة للمرشح.',uTitle:'المخرجات وحدود معرفتنا',uIntro:'فهم المخرجات يبدأ بمصدرها وتغطيتها ومنهجيتها.',cohort:'الدفعة والبرنامج',aUnit:'الفصل · المعلومة وهامشها',bUnit:'السياق · الخطوة المتاحة',cUnit:'المعلومة / أساسها / الإجراء',next:'الإجراء التالي',recordOutput:'السيرة الذاتية تعبير مشتق من السجل',notZero:'غياب البيانات لا يعني صفراً',status:'حالات العرض',notShared:'الارتباط بالجامعة لا يمنح وصولاً إلى السجل الخاص'},
      en:{brand:'جِد',definition:'Saudi Arabia’s Career Infrastructure Platform',contents:'Contents',workspace:'Workspace',record:'Career Record',opportunities:'Opportunities',applications:'My applications',education:'Education',work:'Experience',skills:'Skills',evidence:'Evidence',source:'Source',visibility:'Sharing scope',outputs:'Record outputs',private:'Evidence is private by default',empty:'No data displayed in this concept',individual:'Individual',employer:'Employer',university:'University',iPurpose:'Build your record and choose what to share.',ePurpose:'Define criteria and inspect evidence before deciding.',uPurpose:'Understand outcomes within data and privacy limits.',start:'Start as an Individual',institution:'Register an Employer or University',basis:'Basis of the statement',noSource:'No source displayed',review:'Review what you will share',recipient:'Recipient',disclosure:'Information to be shared',noDisclosure:'No information selected for sharing in this concept.',criteria:'Role criteria',required:'Required evidence',available:'Available evidence',noEvidence:'No evidence displayed',rationale:'Decision and rationale',human:'A human decision after evidence review',method:'Methodology',coverage:'Coverage',period:'Period',population:'Eligible population',suppressed:'Suppressed for privacy',suppressedReason:'Illustrative state: no values or reconstructable details displayed.',unavailable:'No authorized data to display',unknown:'Unavailable in this concept',email:'Account email',verify:'Verify your email',verifyInfo:'Verify the account email before submitting organization and representative details.',orgDetails:'Organization and representative details',pending:'Under review',authorized:'Workspace after approval',noClaim:'Organization registration and representative verification',addRecord:'Start your Career Record',inspect:'Inspect evidence',aTitle:'Your career, in context',bTitle:'From your record to your next step',cTitle:'Professional truth, the basis for the next step',aHome:'Your career space',bHome:'Your next step',cHome:'Your record, in your hands',homeIntro:'Begin with the professional facts you want to record. You choose what is shared and with whom.',rTitle:'One record, many expressions',rIntro:'Education, experience and skills in one Career Record. A CV is an output of this record.',oTitle:'The opportunity and its evidence',oIntro:'Review the opportunity requirements and the information you will share before applying.',eTitle:'Evidence before decision',eIntro:'Compare evidence against the same criteria. No universal candidate score.',uTitle:'Outcomes and the limits of what we know',uIntro:'Understanding outcomes starts with their source, coverage and method.',cohort:'Cohort and program',aUnit:'Chapter · statement and margin',bUnit:'Context · available next step',cUnit:'Statement / basis / action',next:'Next action',recordOutput:'A CV is a derived expression of the record',notZero:'Missing data does not mean zero',status:'Display states',notShared:'University affiliation does not grant access to a private record'}
    };
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const h=(tag,s,cls='')=>`<${tag}${cls?` class="${cls}"`:''}>${esc(s)}</${tag}>`;
    const action=s=>h('span',s,'action-mark');
    const pairs=(labels,t)=>`<div class="basis-list">${labels.map(s=>`<div><strong>${esc(s)}</strong><span>${esc(t.unknown)}</span></div>`).join('')}</div>`;
    const list=labels=>`<div class="section-list">${labels.map(s=>h('div',s)).join('')}</div>`;
    function matrix(t){return `<table><thead><tr><th scope="col">${esc(t.criteria)}</th><th scope="col">${esc(t.required)}</th><th scope="col">${esc(t.available)}</th></tr></thead><tbody><tr><td colspan="3" class="absence">${esc(t.noEvidence)}</td></tr></tbody></table>`;}
    function core(r,t){
      if(r===1)return h('p',t.homeIntro)+action(t.addRecord)+list([t.record,t.opportunities,t.applications]);
      if(r===2)return h('p',t.rIntro)+list([t.education,t.work,t.skills,t.evidence])+h('p',t.empty,'absence');
      if(r===3)return h('p',t.oIntro)+matrix(t)+h('h3',t.disclosure)+h('p',t.noDisclosure)+action(t.review);
      if(r===4)return h('p',t.verifyInfo)+`<div class="form-preview"><label>${esc(t.email)}<input type="email" disabled aria-label="${esc(t.email)}"></label></div>`+action(t.verify);
      if(r===5)return h('p',t.eIntro)+matrix(t)+h('h3',t.rationale)+h('p',t.human);
      return h('p',t.uIntro)+h('h2',t.unavailable,'absence')+pairs([t.source,t.population,t.coverage,t.period,t.method],t);
    }
    function margin(r,t){
      if(r===1)return h('h3',t.basis)+h('p',t.private)+h('p',t.recordOutput);
      if(r===2)return h('h3',t.source)+h('p',t.noSource)+h('h3',t.visibility)+h('p',t.private)+h('h3',t.outputs)+h('p',t.recordOutput);
      if(r===3)return h('h3',t.recipient)+h('p',t.unknown)+h('h3',t.disclosure)+h('p',t.noDisclosure);
      if(r===4)return h('h3',t.next)+h('p',t.orgDetails)+h('p',t.pending)+h('p',t.authorized);
      if(r===5)return h('h3',t.evidence)+h('p',t.noEvidence)+h('h3',t.rationale)+h('p',t.human);
      return h('h3',t.status)+h('p',t.suppressed)+h('p',t.suppressedReason)+h('p',t.notZero)+h('p',t.notShared);
    }
    function render(){
      const k=territory.value,r=Number(experience.value),lang=language.value,t=text[lang];
      const titles=['',t[k+'Home'],t.rTitle,t.oTitle,t.verify,t.eTitle,t.uTitle];
      const nav=r===4?t.noClaim:r===5?t.criteria:r===6?t.cohort:t.record;
      const label={a:'A · The Living Edition / النسخة الحيّة',b:'B · The Passage / العبور',c:'C · The Evidence Bench / طاولة الإثبات'}[k];
      const mast=`<header class="masthead">${h('span',t.brand,'brand')}${h('small',r===0?t.definition:nav)}${h('small',k==='a'?t.contents:k==='b'?t.workspace:t.next)}</header>`;
      let content='';
      if(k==='a'){
        if(r===0)content=`<div class="spread"><section>${h('div',t.definition,'eyebrow')}${h('h1',t.aTitle,'hero-title')}${action(t.start)}<div class="section-list">${h('div',t.institution)}</div></section><aside class="margin">${h('h3',t.basis)}${h('p',t.private)}${h('p',t.notShared)}</aside><section>${[[t.individual,t.iPurpose],[t.employer,t.ePurpose],[t.university,t.uPurpose]].map((v,i)=>`<div class="chapter"><b>${['I','II','III'][i]}</b><div>${h('h2',v[0])}${h('p',v[1])}</div></div>`).join('')}</section><aside class="margin">${h('h3',t.record)}${h('p',t.recordOutput)}</aside></div>`;
        else content=`<div class="spread"><section>${h('div',t.aUnit,'eyebrow')}${h('h1',titles[r])}${core(r,t)}</section><aside class="margin">${margin(r,t)}</aside></div>`;
        content+=`<footer class="footline">${h('span',t.definition)}${h('span',t.private)}</footer>`;
      }else if(k==='b'){
        if(r===0)content=`<div class="passage"><div class="panorama"><section class="path-entry">${h('h2',t.employer)}${h('p',t.ePurpose)}</section><section class="aperture">${h('h1',t.bTitle)}${h('p',t.individual)}${action(t.start)}</section><section class="path-entry">${h('h2',t.university)}${h('p',t.uPurpose)}</section></div>${h('p',t.iPurpose)}${h('p',t.institution)}</div>`;
        else content=`<div class="passage"><div class="context-line">${h('span',nav)}${h('span',t.bUnit)}</div><section class="focus-plane">${h('h1',titles[r])}${core(r,t)}<div class="plane-pair"><section>${h('h3',r===6?t.notZero:t.basis)}${h('p',r===6?t.notShared:t.private)}</section><section>${margin(r,t)}</section></div></section></div>`;
        content+=`<footer class="dock">${(r===0?[t.individual,t.employer,t.university]:r===4?[t.verify,t.orgDetails,t.pending]:r===5?[t.criteria,t.evidence,t.rationale]:r===6?[t.cohort,t.coverage,t.method]:[t.record,t.opportunities,t.applications]).map(s=>h('span',s)).join('')}</footer>`;
      }else{
        if(r===0)content=`<div class="public-bench">${h('div',t.cUnit,'eyebrow')}${h('h1',t.cTitle)}<div class="actor-work">${[[t.individual,t.iPurpose],[t.employer,t.ePurpose],[t.university,t.uPurpose]].map(v=>`<section>${h('h2',v[0])}${h('p',v[1])}</section>`).join('')}</div></div>`;
        else{
          const index=r===4?[t.verify,t.orgDetails,t.pending]:r===5?[t.criteria,t.evidence,t.rationale]:r===6?[t.cohort,t.coverage,t.method]:[t.record,t.education,t.work,t.skills];
          content=`<div class="bench"><aside class="object-index">${index.map((s,i)=>h('div',s,i===0?'selected':'')).join('')}</aside><section class="work-area">${h('div',t.cUnit,'eyebrow')}${h('h1',titles[r])}${core(r,t)}<aside class="object-box">${margin(r,t)}</aside></section></div>`;
        }
        content+=`<footer class="decision-strip">${h('span',r===5?t.human:r===6?t.notZero:t.private)}${action(r===0?t.start:r===5?t.inspect:r===4?t.verify:r===6?t.method:r===3?t.review:t.record)}</footer>`;
      }
      stage.innerHTML=`<div class="territory-label"><strong>${esc(label)}</strong><span>${esc(experience.options[r].text)}</span></div><article class="screen ${k}" lang="${lang}" dir="${lang==='ar'?'rtl':'ltr'}" aria-label="${esc(label)}">${mast}${content}</article>`;
    }
    [territory,experience,language].forEach(el=>el.addEventListener('change',render));
    render();
    if(globalThis.Tweak){const state={territory:'a',language:'ar'};const tweak=new Tweak({container:root,onChange:()=>{territory.value=state.territory;language.value=state.language;render();}});tweak.addSelect(state,'territory',{label:'Territory',options:[{label:'Living Edition',value:'a'},{label:'Passage',value:'b'},{label:'Evidence Bench',value:'c'}]});tweak.addSelect(state,'language',{label:'Language',options:[{label:'العربية',value:'ar'},{label:'English',value:'en'}]});}
  })();
  </script>
</div>
