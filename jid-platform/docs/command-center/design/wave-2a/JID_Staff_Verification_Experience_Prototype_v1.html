<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JID — تجربة فريق العمل للتحقق</title>
<style>
:root{
  --olive:#2F3A2E;
  --olive-2:#414D40;
  --gold:#E6B43A;
  --off:#F7F5EF;
  --overdue:#B3452F;
  --border:#DAD5C7;
  --muted:#6B6F63;
  --white:#FFFFFF;
  --radius:6px;
  --gap:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--off);
  color:var(--olive);
  font-family:"Segoe UI","Tahoma","Geeza Pro","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.6;
}
[dir="rtl"] body{font-family:"Segoe UI","Tahoma","Geeza Pro",sans-serif;}
button{font-family:inherit;font-size:inherit;}
a{color:inherit;}
h1,h2,h3,h4{margin:0 0 4px 0;font-weight:600;color:var(--olive);}
p{margin:0 0 8px 0;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.skip-link{position:absolute;inset-inline-start:8px;top:-40px;background:var(--olive);color:#fff;padding:8px 14px;border-radius:4px;z-index:100;transition:top .15s;}
.skip-link:focus{top:8px;}

/* Shell */
#app{display:flex;min-height:100vh;}
.sidenav{
  width:220px;flex:none;background:var(--white);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 0;
}
.sidenav .brand{padding:0 20px 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.sidenav .brand .wordmark{font-weight:700;font-size:18px;color:var(--olive);}
.sidenav .brand .tagline{font-size:12px;color:var(--muted);}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--olive-2);
  text-decoration:none;font-size:14px;border-inline-start:3px solid transparent;cursor:pointer;background:none;border-top:none;border-bottom:none;border-end:none;width:100%;text-align:start;
}
.nav-item:hover{background:var(--off);}
.nav-item.active{border-inline-start-color:var(--gold);color:var(--olive);font-weight:600;background:var(--off);}
.nav-item:focus-visible, a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:3px solid var(--gold);outline-offset:2px;
}
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.topbar .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pill-toggle{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.pill-toggle button{
  padding:6px 14px;background:var(--white);border:none;color:var(--olive-2);cursor:pointer;font-size:13px;
}
.pill-toggle button.active{background:var(--olive);color:#fff;}
.demo-note{font-size:11px;color:var(--muted);border:1px dashed var(--border);border-radius:4px;padding:4px 8px;}
select, .select-like{
  border:1px solid var(--border);border-radius:4px;padding:6px 10px;background:var(--white);color:var(--olive);font-size:13px;
}
main{flex:1;padding:24px;max-width:1100px;width:100%;margin:0;}
[dir="ltr"] main{margin:0;}
.screen-header{margin-bottom:18px;}
.screen-header h1{font-size:22px;}
.screen-header .subtitle{color:var(--muted);font-size:14px;}
.back-link{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--olive-2);text-decoration:none;}
.back-link:hover{text-decoration:underline;}

/* Filters */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);}
.filter-bar input[type="search"]{border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-size:13px;min-width:200px;flex:1;}
.filter-group label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px;}
.preview-state-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.preview-state-bar .label{border:1px dashed var(--border);padding:3px 8px;border-radius:4px;}
.preview-state-bar button{border:1px solid var(--border);background:var(--white);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--olive-2);}
.preview-state-bar button.active{background:var(--olive-2);color:#fff;border-color:var(--olive-2);}

/* Cards / list */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.v-card{
  display:block;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;text-decoration:none;color:inherit;cursor:pointer;
}
.v-card:hover{border-color:var(--olive-2);}
.v-card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.v-card .org{font-weight:600;font-size:15px;color:var(--olive);}
.v-card .claimant{font-size:13px;color:var(--muted);margin-top:2px;}
.v-card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);white-space:nowrap;}
.badge-type-business{background:#EEF0EA;color:var(--olive);border-color:var(--olive);}
.badge-type-university{background:#EAECE9;color:var(--olive-2);border-color:var(--olive-2);}
.badge-status{background:var(--off);color:var(--olive-2);}
.badge-status.status-approved{color:#2F3A2E;border-color:var(--olive);}
.badge-status.status-rejected{color:var(--overdue);border-color:var(--overdue);}
.badge-urgency{font-weight:600;}
.badge-urgency.overdue{color:var(--overdue);border-color:var(--overdue);background:#FBEDE9;}
.badge-urgency.critical{color:#8A5A16;border-color:#8A5A16;background:#FBF1DD;}
.badge-urgency.warning{color:var(--olive-2);}
.badge-urgency.normal{color:var(--muted);}
.self-flag{font-size:11px;color:var(--overdue);border:1px solid var(--overdue);background:#FBEDE9;padding:2px 8px;border-radius:20px;}

/* Empty / error / skeleton */
.state-block{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted);}
.state-block h3{color:var(--olive);}
.state-block .btn{margin-top:10px;}
.skeleton-row{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.skeleton-bar{height:12px;border-radius:3px;background:linear-gradient(90deg,#EDEAE0,#F4F2EA,#EDEAE0);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px;}
@keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.skeleton-bar.w-40{width:40%;}
.skeleton-bar.w-25{width:25%;}
.skeleton-bar.w-60{width:60%;}

/* Buttons */
.btn{border-radius:4px;padding:9px 16px;font-size:14px;cursor:pointer;border:1px solid var(--olive);background:var(--white);color:var(--olive);}
.btn:hover{background:var(--off);}
.btn-primary{background:var(--olive);color:#fff;border-color:var(--olive);}
.btn-primary:hover{background:#26301F;}
.btn-gold{background:var(--gold);color:var(--olive);border-color:var(--gold);font-weight:600;}
.btn-gold:hover{background:#D9A62E;}
.btn-danger-outline{border-color:var(--overdue);color:var(--overdue);background:var(--white);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;display:block;text-align:center;}
.btn-sm{padding:5px 10px;font-size:12px;}

/* Workspace layout */
.workspace-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
@media (max-width: 900px){.workspace-grid{grid-template-columns:1fr;}}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.panel h2{font-size:15px;text-transform:none;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;}
dl.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0;}
@media (max-width:520px){dl.info-grid{grid-template-columns:1fr;}}
dl.info-grid dt{font-size:12px;color:var(--muted);margin:0;}
dl.info-grid dd{font-size:14px;margin:0;color:var(--olive);font-weight:500;}
.sticky-rail{position:sticky;top:16px;}
.notice-banner{background:#EEF0EA;border:1px solid var(--olive-2);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:14px;}
.notice-banner.warn{background:#FBF1DD;border-color:#8A5A16;}
.notice-banner.block{background:#FBEDE9;border-color:var(--overdue);color:var(--overdue);}

/* evidence list */
.evidence-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.evidence-item:last-child{border-bottom:none;}
.evidence-item .fname{font-size:13px;}
.evidence-item .funavail{font-size:12px;color:var(--muted);font-style:italic;}

/* checklist */
.checklist-item{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.checklist-item input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--olive);}
.checklist-item .label{font-size:13px;font-weight:600;}
.checklist-item .hint{font-size:12px;color:var(--muted);margin-top:2px;}
.checklist-progress{font-size:12px;color:var(--muted);margin-bottom:10px;}

/* decision panel */
.decision-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.decision-option{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.decision-option.selected{border-color:var(--olive);background:var(--off);}
.decision-option input{accent-color:var(--olive);}
textarea{width:100%;border:1px solid var(--border);border-radius:4px;padding:9px;font-family:inherit;font-size:13px;min-height:90px;resize:vertical;}
textarea.invalid{border-color:var(--overdue);}
.field-error{color:var(--overdue);font-size:12px;margin-top:4px;}
.field-hint{color:var(--muted);font-size:12px;margin-top:4px;}

/* evidence viewer modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(47,58,46,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.modal-close{background:none;border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer;}
.doc-frame{border:1px dashed var(--border);border-radius:4px;min-height:220px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--off);margin:12px 0;text-align:center;padding:20px;}

footer.demo-footer{padding:14px 24px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);}
.sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>

/* ---------- App state ---------- */
const state = {
  locale: "ar",
  identity: "staff", // 'staff' | 'applicant'
  previewOverride: {}, // per-screen key -> 'loading'|'empty'|'error'|null
  checklists: {},      // requestId -> {key:bool}
  evidenceModal: null, // {reqId, evId, simError:bool}
};

function t(key, vars){
  let s = T[state.locale][key] || key;
  if(vars){ Object.keys(vars).forEach(k=>{ s = s.replace("{"+k+"}", vars[k]); }); }
  return s;
}
function orgName(r){ return state.locale==="ar" ? r.org_ar : r.org_en; }
function claimantName(r){ return state.locale==="ar" ? r.claimant_ar : r.claimant_en; }
function titleText(r){ return state.locale==="ar" ? r.title_ar : r.title_en; }
function entityStateText(r){ return state.locale==="ar" ? r.entity_state_ar : r.entity_state_en; }
function evName(e){ return state.locale==="ar" ? e.name_ar : e.name_en; }

function urgencyTier(r){
  if(r.status==="approved"||r.status==="rejected") return null;
  if(r.sla_hours<0) return "overdue";
  if(r.sla_hours<4) return "critical";
  if(r.sla_hours<12) return "warning";
  return "normal";
}
function announce(msg){ const el=document.getElementById("live-region"); if(el){ el.textContent=""; setTimeout(()=>{el.textContent=msg;},30); } }

/* ---------- Small render helpers ---------- */
function typeBadge(r){
  const cls = r.type==="business" ? "badge-type-business" : "badge-type-university";
  const label = r.type==="business" ? t("type_business") : t("type_university");
  return `<span class="badge ${cls}">${label}</span>`;
}
function statusBadge(r){
  const label = t("status_"+r.status);
  return `<span class="badge badge-status status-${r.status}">${label}</span>`;
}
function urgencyBadge(r){
  const tier = urgencyTier(r);
  if(!tier) return "";
  return `<span class="badge badge-urgency ${tier}">${t("urgency_"+tier)}</span>`;
}
function selfFlag(r){
  return r.applicant_id===CURRENT_STAFF_ID ? `<span class="self-flag">${t("self_flag")}</span>` : "";
}
function relTime(hours){
  if(state.locale==="ar") return hours<24 ? `منذ ${hours} ساعة` : `منذ ${Math.round(hours/24)} يوم`;
  return hours<24 ? `${hours}h ago` : `${Math.round(hours/24)}d ago`;
}

function skeletonList(n){
  let out = `<div class="list">`;
  for(let i=0;i<n;i++){
    out += `<div class="skeleton-row"><div class="skeleton-bar w-40"></div><div class="skeleton-bar w-25"></div></div>`;
  }
  return out + `</div>`;
}
function errorBlock(onRetryAttr){
  return `<div class="state-block" role="alert">
    <h3>${t("error_title")}</h3><p>${t("error_sub")}</p>
    <button class="btn btn-primary" ${onRetryAttr}>${t("retry")}</button>
  </div>`;
}
function emptyBlock(title, sub, secondaryHtml){
  return `<div class="state-block">
    <h3>${title}</h3><p>${sub}</p>${secondaryHtml||""}
  </div>`;
}
function previewBar(screenKey){
  const cur = state.previewOverride[screenKey] || "populated";
  const opts = [["populated","preview_populated"],["loading","preview_loading"],["empty","preview_empty"],["error","preview_error"]];
  let btns = opts.map(([val,labelKey])=>
    `<button class="${cur===val?'active':''}" data-action="set-preview" data-screen="${screenKey}" data-value="${val}">${t(labelKey)}</button>`
  ).join("");
  return `<div class="preview-state-bar"><span class="label">${t("preview_label")}</span>${btns}</div>`;
}

function card(r){
  return `<a class="v-card" href="#/workspace/${r.id}" data-nav="1">
    <div class="v-card-row">
      <div>
        <div class="org">${orgName(r)}</div>
        <div class="claimant">${claimantName(r)}</div>
      </div>
      <div class="meta">${selfFlag(r)}${typeBadge(r)}${statusBadge(r)}${urgencyBadge(r)}</div>
    </div>
  </a>`;
}

function filterMatches(r, f){
  if(f.type!=="all" && r.type!==f.type) return false;
  if(f.assign==="mine" && r.assigned!==CURRENT_STAFF_ID) return false;
  if(f.assign==="unassigned" && r.assigned!==null) return false;
  if(f.urgency!=="all" && urgencyTier(r)!==f.urgency) return false;
  if(f.q){
    const q=f.q.toLowerCase();
    if(!(orgName(r).toLowerCase().includes(q) || claimantName(r).toLowerCase().includes(q))) return false;
  }
  return true;
}

let queueFilter = {type:"all", assign:"all", urgency:"all", q:""};
let myQueueFilter = {type:"all", assign:"mine", urgency:"all", q:""};

function filterControls(screenKey, f, showAssign){
  return `<div class="filter-bar">
    <div class="filter-group"><label>${t("search_ph")}</label>
      <input type="search" placeholder="${t("search_ph")}" value="${f.q}" data-action="filter-q" data-screen="${screenKey}" aria-label="${t("search_ph")}">
    </div>
    <div class="filter-group"><label>${t("filter_type_all")}</label>
      <select data-action="filter-type" data-screen="${screenKey}">
        <option value="all" ${f.type==="all"?"selected":""}>${t("filter_type_all")}</option>
        <option value="business" ${f.type==="business"?"selected":""}>${t("filter_type_business")}</option>
        <option value="university" ${f.type==="university"?"selected":""}>${t("filter_type_university")}</option>
      </select>
    </div>
    ${showAssign ? `<div class="filter-group"><label>${t("filter_all")}</label>
      <select data-action="filter-assign" data-screen="${screenKey}">
        <option value="all" ${f.assign==="all"?"selected":""}>${t("filter_all")}</option>
        <option value="unassigned" ${f.assign==="unassigned"?"selected":""}>${t("filter_unassigned")}</option>
        <option value="mine" ${f.assign==="mine"?"selected":""}>${t("filter_mine")}</option>
      </select>
    </div>` : ""}
    <div class="filter-group"><label>${t("filter_urgency_all")}</label>
      <select data-action="filter-urgency" data-screen="${screenKey}">
        <option value="all" ${f.urgency==="all"?"selected":""}>${t("filter_urgency_all")}</option>
        <option value="overdue" ${f.urgency==="overdue"?"selected":""}>${t("filter_urgency_overdue")}</option>
        <option value="critical" ${f.urgency==="critical"?"selected":""}>${t("filter_urgency_critical")}</option>
        <option value="normal" ${f.urgency==="normal"?"selected":""}>${t("filter_urgency_normal")}</option>
      </select>
    </div>
  </div>`;
}

/* ---------- Screen renderers ---------- */
function renderListScreen(opts){
  const {screenKey, title, subtitle, filter, showAssign, items, emptyTitle, emptySub, extraEmptyAction} = opts;
  const preview = state.previewOverride[screenKey] || "populated";
  let body;
  if(preview==="loading"){ body = skeletonList(4); }
  else if(preview==="error"){ body = errorBlock(`data-action="clear-preview" data-screen="${screenKey}"`); }
  else if(preview==="empty" || items.length===0){
    const isFilterEmpty = preview!=="empty" && (filter.type!=="all"||filter.assign!=="all"&&showAssign||filter.urgency!=="all"||filter.q);
    body = emptyBlock(
      isFilterEmpty ? emptyTitle : emptyTitle,
      isFilterEmpty ? t("empty_queue_sub") : (emptySub||""),
      extraEmptyAction||""
    );
  } else {
    body = `<ul class="list" style="list-style:none;padding:0;margin:0;">` + items.map(r=>`<li>${card(r)}</li>`).join("") + `</ul>`;
  }
  return `
    <div class="screen-header"><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>
    ${previewBar(screenKey)}
    ${filterControls(screenKey, filter, showAssign)}
    ${body}
  `;
}

  const items = DATA.filter(r=>filterMatches(r, queueFilter));
  return renderListScreen({
    screenKey:"queue", title:t("queue_title"), subtitle:t("queue_subtitle"),

    emptyTitle:t("empty_queue_title"), emptySub:t("empty_queue_sub"),
  });
}

  const items = DATA.filter(r=>filterMatches(r, myQueueFilter));

  });
}

function auditTrail(r){
  const items = [
    {k:"audit_submitted", h:r.submitted_hours_ago},
  ];
  if(r.assigned) items.push({k:"audit_assigned", h:Math.max(r.submitted_hours_ago-1,0)});
  if((r.evidence||[]).length) items.push({k:"audit_evidence_view", h:Math.max(r.submitted_hours_ago-2,0)});
  if(r.status==="approved"||r.status==="rejected") items.push({k:"audit_decision", h:r.decided_hours_ago||0});
  return items.sort((a,b)=>b.h-a.h).map(i=>`<li>${t(i.k)} — <span class="claimant">${relTime(i.h)}</span></li>`).join("");
}

function checklistPanel(r){
  const defs = CHECKLIST_DEFS[r.type];
  const cl = state.checklists[r.id] || {};
  const domainMatch = (r.domains_onfile||[]).includes(r.declared_domain);
  let rows = defs.map(d=>{
    const checked = !!cl[d.key];
    const hint = d.key==="domain_match" ? `<div class="field-hint">${t("field_domain_declared")}: ${r.declared_domain} — ${domainMatch? t("domain_match_yes") : t("domain_match_no")}</div>` : "";
    return `<div class="checklist-item">
      <input type="checkbox" id="cl-${d.key}" data-action="toggle-checklist" data-req="${r.id}" data-key="${d.key}" ${checked?"checked":""} ${r.status==="approved"||r.status==="rejected"?"disabled":""}>
      <label for="cl-${d.key}">${t(d.labelKey)}${hint}</label>
    </div>`;
  }).join("");
  const done = defs.filter(d=>cl[d.key]).length;
  return `<div class="panel">
    <h2>${t("ws_checklist")}</h2>
    ${rows}
    <p class="field-hint" style="margin-top:8px;">${t("checklist_progress",{n:done,m:defs.length})}</p>
  </div>`;
}
function checklistComplete(r){
  const defs = CHECKLIST_DEFS[r.type];
  const cl = state.checklists[r.id] || {};
  return defs.every(d=>cl[d.key]);
}

function decisionPanel(r){
  if(r.status==="approved") return `<div class="panel"><h2>${t("ws_decision")}</h2><div class="notice-banner">${t("approved_body")}</div></div>`;
  if(r.status==="rejected") return `<div class="panel"><h2>${t("ws_decision")}</h2><div class="notice-banner block">${t("rejected_note")} ${r.rejection_reason||""}</div></div>`;

  const isSelf = r.applicant_id===CURRENT_STAFF_ID;
  if(isSelf){
    return `<div class="panel"><h2>${t("ws_decision")}</h2>
      <div class="notice-banner block"><strong>${t("self_block_title")}</strong><br>${t("self_block_body")}</div>
    </div>`;
  }
  if(r.assigned && r.assigned!==CURRENT_STAFF_ID){
    return `<div class="panel"><h2>${t("ws_decision")}</h2><div class="notice-banner warn">${t("assigned_other")}</div></div>`;
  }
  const complete = checklistComplete(r);
  return `<div class="panel">
    <h2>${t("ws_decision")}</h2>
    <div class="decision-options" role="radiogroup" aria-label="${t('ws_decision')}">
      <label class="decision-option"><input type="radio" name="decision" value="approve" data-action="pick-decision" ${!complete?"disabled":""}> ${t("decision_approve")}</label>
      <label class="decision-option"><input type="radio" name="decision" value="reject" data-action="pick-decision"> ${t("decision_reject")}</label>
      <label class="decision-option"><input type="radio" name="decision" value="more_info" data-action="pick-decision"> ${t("decision_more_info")}</label>
    </div>
    ${!complete ? `<p class="field-hint">${t("approve_locked")}</p>` : ""}
    <div id="reason-wrap" style="display:none;margin-top:10px;">
      <label for="reason-field">${t("reason_label")}</label>
      <textarea id="reason-field" data-action="reason-input" placeholder="${t('reason_ph')}"></textarea>
      <p class="field-hint" id="reason-error" style="display:none;color:var(--overdue);">${t("reason_error")}</p>
    </div>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" data-action="submit-decision" data-req="${r.id}">${t("confirm_decision")}</button>
    </div>
  </div>`;
}

function evidenceList(r){
  if(!r.evidence || r.evidence.length===0){
    return `<div class="panel"><h2>${t("ws_evidence")}</h2><p class="field-hint">${t("no_evidence_title")}</p></div>`;
  }
  const rows = r.evidence.map(e=>`
    <div class="evidence-item">
      <span>${evName(e)} <span class="field-hint">(.${e.format})</span></span>
      <button class="btn btn-sm" data-action="open-evidence" data-req="${r.id}" data-ev="${e.id}">${t("view_evidence")}</button>
    </div>`).join("");
  return `<div class="panel"><h2>${t("ws_evidence")}</h2>${rows}</div>`;
}

function relatedList(r){
  if(!r.related || r.related.length===0) return `<div class="panel"><h2>${t("ws_related")}</h2><p class="field-hint">${t("no_related")}</p></div>`;
  const rows = r.related.map(id=>`<li>${id}</li>`).join("");
  return `<div class="panel"><h2>${t("ws_related")}</h2><ul>${rows}</ul></div>`;
}

function renderWorkspace(id){
  const r = findReq(id);
  if(!r){
    return `<div class="screen-header"><h1>${t("queue_title")}</h1></div>${emptyBlock(t("not_found"),"",`<a class="btn btn-sm" href="#/queue" data-nav="1">${t("back_to_queue")}</a>`)}`;
  }
  const domainMatch = (r.domains_onfile||[]).includes(r.declared_domain);
  return `
    <a class="btn btn-sm" href="#/queue" data-nav="1" style="margin-bottom:14px;display:inline-block;">&larr; ${t("back_to_queue")}</a>
    <div class="screen-header">
      <h1>${orgName(r)}</h1>
      <p class="subtitle">${t("status_line",{status:t("status_"+r.status), time:relTime(r.submitted_hours_ago)})}</p>
      <div style="margin-top:6px;">${typeBadge(r)}${statusBadge(r)}${urgencyBadge(r)}${selfFlag(r)}</div>
    </div>
    <div class="workspace-grid">
      <div>
        <div class="panel">
          <h2>${t("ws_applicant")}</h2>
          <dl class="info-grid">
            <div><dt>${t("field_name")}</dt><dd>${claimantName(r)}</dd></div>
            <div><dt>${t("field_title")}</dt><dd>${titleText(r)}</dd></div>
            <div><dt>${t("field_email")}</dt><dd>${r.email}</dd></div>
            <div><dt>${t("field_domain_declared")}</dt><dd>${r.declared_domain} — ${domainMatch? t("domain_match_yes") : t("domain_match_no")}</dd></div>
          </dl>
        </div>
        <div class="panel">
          <h2>${t("ws_org")}</h2>
          <dl class="info-grid">
            <div><dt>${t("field_entity_state")}</dt><dd>${entityStateText(r)}</dd></div>
            <div><dt>${t("field_domains_onfile")}</dt><dd>${(r.domains_onfile||[]).join(", ")}</dd></div>
          </dl>
        </div>
        ${evidenceList(r)}
        ${relatedList(r)}
        <div class="panel"><h2>${t("ws_audit")}</h2><ul>${auditTrail(r)}</ul></div>
      </div>
      <div>
        ${r.status==="approved"||r.status==="rejected" ? "" : checklistPanel(r)}
        ${decisionPanel(r)}
      </div>
    </div>
  `;
}

/* ---------- Evidence viewer modal ---------- */
function evidenceModalHtml(){
  const m = state.evidenceModal;
  if(!m) return "";
  const r = findReq(m.reqId);
  const e = r && (r.evidence||[]).find(x=>x.id===m.evId);
  const SUPPORTED = ["pdf","jpg","png"];
  let body;
  if(!e){
    body = `<div class="state-block"><h3>${t("no_evidence_title")}</h3></div>`;
  } else if(m.simError){
    body = errorBlock(`data-action="evidence-retry"`);
  } else if(!SUPPORTED.includes(e.format)){
    body = `<div class="state-block"><h3>${t("unsupported_title")}</h3></div>`;
  } else {
    body = `<div class="state-block"><p>${evName(e)}.${e.format}</p><p class="field-hint">${t("evidence_loading")} (${t("demo_banner")})</p></div>`;
  }
  return `<div class="modal-backdrop" data-action="close-evidence">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${t('view_evidence')}" onclick="event.stopPropagation()">
      <div class="notice-banner warn">${t("evidence_privacy")}</div>
      ${body}
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-sm" data-action="close-evidence">${t("close")}</button>
        ${e && SUPPORTED.includes(e.format) && !m.simError ? `<button class="btn btn-sm" data-action="noop">${t("download_secure")}</button>` : ""}
        ${e && !m.simError ? `<button class="btn btn-sm btn-danger-outline" data-action="evidence-sim-error">${t("simulate_error")}</button>` : ""}
      </div>
    </div>
  </div>`;
}

/* ---------- Decision confirmation screens ---------- */
function renderConfirmation(id, kind){
  const r = findReq(id);
  if(!r) return renderWorkspace(id);
  const titleKey = kind==="approved" ? "approved_title" : "moreinfo_title";
  const bodyKey = kind==="approved" ? "approved_body" : "moreinfo_body";
  return `
    <a class="btn btn-sm" href="#/queue" data-nav="1" style="margin-bottom:14px;display:inline-block;">&larr; ${t("back_to_queue")}</a>
    <div class="screen-header"><h1>${t(titleKey)}</h1></div>
    <div class="panel" style="max-width:640px;">
      <p>${t(bodyKey)}</p>
      ${kind!=="approved" && r.review_notes ? `<div class="notice-banner" style="margin-top:12px;">${r.review_notes}</div>` : ""}
      <div style="margin-top:16px;"><a class="btn btn-primary" href="#/queue" data-nav="1">${t("back_to_queue")}</a></div>
    </div>
  `;
}

/* ---------- Router ---------- */
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  return parts;
}
function render(){
  const parts = currentRoute();
  const main = document.getElementById("main");
  const navKey = document.getElementById("app");
  let html = "";
  let activeNav = "queue";

  if(parts.length===0 || parts[0]==="queue"){ html = renderQueue(); activeNav="queue"; }
  else if(parts[0]==="my-queue"){ html = renderMyQueue(); activeNav="myqueue"; }
  else if(parts[0]==="history"){ html = renderHistory(); activeNav="history"; }
  else if(parts[0]==="sys-dashboard"){ html = renderSysDashboard(); activeNav="sys"; }
  else if(parts[0]==="workspace" && parts[1]){ html = renderWorkspace(parts[1]); activeNav="queue"; }
  else if(parts[0]==="confirm" && parts[1] && parts[2]){ html = renderConfirmation(parts[1], parts[2]); activeNav="queue"; }
  else { html = renderQueue(); activeNav="queue"; }

  main.innerHTML = html;
  main.appendChild(strToNode(evidenceModalHtml()));
  document.querySelectorAll(".sidenav a").forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-navkey")===activeNav);
  });
  document.documentElement.dir = state.locale==="ar" ? "rtl" : "ltr";
  document.documentElement.lang = state.locale;
}
function strToNode(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.firstElementChild || document.createTextNode("");
}
function go(hash){ location.hash = hash; }

/* ---------- Shell (static chrome, rendered once) ---------- */
function renderShell(){
  document.getElementById("app").innerHTML = `
    <nav class="sidenav" aria-label="Primary">
      <div class="brand"><div class="wordmark">${t("wordmark")}</div><div class="tagline">${t("tagline")}</div></div>
      <a class="nav-item" href="#/queue" data-nav="1" data-navkey="queue">${t("nav_queue")}</a>
      <a class="nav-item" href="#/my-queue" data-nav="1" data-navkey="myqueue">${t("nav_myqueue")}</a>
      <a class="nav-item" href="#/history" data-nav="1" data-navkey="history">${t("nav_history")}</a>
      <a class="nav-item" href="#/sys-dashboard" data-nav="1" data-navkey="sys">${t("nav_sys")}</a>
    </nav>
    <div class="main-col">
      <div class="topbar">
        <div class="demo-note">${t("demo_banner")}</div>
        <div class="controls">
          <span class="field-hint">${t("identity_label")}</span>
          <select data-action="set-identity" aria-label="${t('identity_label')}">
            <option value="staff" ${state.identity==="staff"?"selected":""}>${t("identity_staff")}</option>
            <option value="applicant" ${state.identity==="applicant"?"selected":""}>${t("identity_applicant")}</option>
          </select>
          <div class="pill-toggle" role="group" aria-label="Language">
            <button class="${state.locale==='ar'?'active':''}" data-action="set-locale" data-value="ar">${t("lang_ar")}</button>
            <button class="${state.locale==='en'?'active':''}" data-action="set-locale" data-value="en">${t("lang_en")}</button>
          </div>
        </div>
      </div>
      <main id="main" tabindex="-1"></main>
      <footer class="demo-footer">${t("demo_banner")} · <button data-action="reset-demo" style="background:none;border:none;color:var(--olive-2);text-decoration:underline;cursor:pointer;padding:0;font:inherit;">${t("reset_demo")}</button></footer>
    </div>
  `;
}

/* ---------- Event delegation ---------- */
document.addEventListener("click", function(ev){
  const el = ev.target.closest("[data-action]");
  const navEl = ev.target.closest("[data-nav]");
  if(navEl && navEl.tagName==="A"){
    // allow default hash navigation; just announce after
    setTimeout(()=>announce(document.querySelector(".screen-header h1")?.textContent||""), 60);
  }
  if(!el) return;
  const action = el.getAttribute("data-action");

  if(action==="set-locale"){
    state.locale = el.getAttribute("data-value");
    renderShell(); render();
  }
  else if(action==="set-identity"){ /* handled on change, ignore click on select itself */ }
  else if(action==="set-preview"){
    state.previewOverride[el.getAttribute("data-screen")] = el.getAttribute("data-value")==="populated" ? null : el.getAttribute("data-value");
    render();
  }
  else if(action==="clear-preview"){
    state.previewOverride[el.getAttribute("data-screen")] = null;
    render();
  }
  else if(action==="toggle-checklist"){
    const req = el.getAttribute("data-req"), key = el.getAttribute("data-key");
    state.checklists[req] = state.checklists[req] || {};
    state.checklists[req][key] = el.checked;
    render();
  }
  else if(action==="pick-decision"){
    const wrap = document.getElementById("reason-wrap");
    if(wrap) wrap.style.display = (el.value==="reject"||el.value==="more_info") ? "block" : "none";
  }
  else if(action==="submit-decision"){
    const reqId = el.getAttribute("data-req");
    const picked = document.querySelector('input[name="decision"]:checked');
    if(!picked){ announce(t("reason_error")); return; }
    const val = picked.value;
    const reasonField = document.getElementById("reason-field");
    const reasonVal = reasonField ? reasonField.value.trim() : "";
    if((val==="reject"||val==="more_info") && reasonVal.length<10){
      const err = document.getElementById("reason-error");
      if(err) err.style.display = "block";
      return;
    }
    const r = findReq(reqId);
    if(!r) return;
    if(val==="approve"){
      r.status = "approved"; r.decided_hours_ago = 0;
      go("#/confirm/"+reqId+"/approved");
    } else if(val==="reject"){
      r.status = "rejected"; r.rejection_reason = reasonVal; r.review_notes = reasonVal; r.decided_hours_ago = 0; r.can_reapply_after_days = 14;
      go("#/confirm/"+reqId+"/rejected");
    } else {
      r.status = "needs_more_info"; r.review_notes = reasonVal;
      go("#/confirm/"+reqId+"/moreinfo");
    }
  }
  else if(action==="open-evidence"){
    state.evidenceModal = {reqId: el.getAttribute("data-req"), evId: el.getAttribute("data-ev"), simError:false};
    render();
  }
  else if(action==="close-evidence"){
    state.evidenceModal = null;
    render();
  }
  else if(action==="evidence-sim-error"){
    if(state.evidenceModal){ state.evidenceModal.simError = true; render(); }
  }
  else if(action==="evidence-retry"){
    if(state.evidenceModal){ state.evidenceModal.simError = false; render(); }
  }
  else if(action==="reset-demo"){
    DATA = seedData();
    state.checklists = {};
    state.previewOverride = {};
    state.evidenceModal = null;
    go("#/queue");
    render();
    announce(t("reset_demo"));
  }
});

document.addEventListener("input", function(ev){
  const el = ev.target;
  if(el.getAttribute && el.getAttribute("data-action")==="filter-q"){
    const screen = el.getAttribute("data-screen");
    (screen==="queue"?queueFilter:myQueueFilter).q = el.value;
    render();
    const focusSel = `[data-action="filter-q"][data-screen="${screen}"]`;
    const toFocus = document.querySelector(focusSel);
    if(toFocus){ toFocus.focus(); toFocus.selectionStart = toFocus.selectionEnd = toFocus.value.length; }
  }
  if(el.getAttribute && el.getAttribute("data-action")==="reason-input"){
    const err = document.getElementById("reason-error");
    if(err && el.value.trim().length>=10) err.style.display = "none";
  }
});

document.addEventListener("change", function(ev){
  const el = ev.target;
  const action = el.getAttribute && el.getAttribute("data-action");
  if(action==="filter-type"){
    const screen = el.getAttribute("data-screen");
    (screen==="queue"?queueFilter:myQueueFilter).type = el.value; render();
  }
  else if(action==="filter-assign"){
    queueFilter.assign = el.value; render();
  }
  else if(action==="filter-urgency"){
    const screen = el.getAttribute("data-screen");
    (screen==="queue"?queueFilter:myQueueFilter).urgency = el.value; render();
  }
  else if(action==="set-identity"){
    state.identity = el.value;
    render();
  }
});

/* ---------- Init ---------- */
function init(){
  renderShell();
  render();
}
window.addEventListener("hashchange", render);
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
</script>
</body>
</html>
